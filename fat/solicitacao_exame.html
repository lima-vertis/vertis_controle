    <script>

        //const endpoint = 'http://constellation.newvertis.com.br/vertis/VertisConnect.dll/api/V1.1/get_solicitacao_exame';
        //const endpoint = 'http://constellation.newvertis.com.br/vertis/VertisConnect.dll/api/V1.1/get_solicitacao_exame_lista';
        const endpoint = '/api/solicitacao_exames_lista';

        let originalData = [];
        let filteredData = [];

        let sortKey = 'count';
        let sortAsc = false;
        let currentPage = 1;
        const recordsPerPage = 10;

        const columns = [
            {
                key: 'cod_unid_negoc',
                label: 'Unid. Negócio'
            },
            {
                key: 'cod_unid_oper',
                label: 'Unid. Oper.'
            },
            {
                key: 'nom_unid_oper',
                label: 'Unidade operacional'
            },
            {
                key: 'count',
                label: 'Solicitações'
            }
        ];

        const normalizeText = value =>
            String(value ?? '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .trim()
                .toLowerCase();

        const escapeHtml = value =>
            String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        const formatNumber = value =>
            new Intl.NumberFormat(
                'pt-BR'
            ).format(
                Number(value) || 0
            );

        /*
         * Adiciona automaticamente as barras.
         *
         * 25082026
         * vira
         * 25/08/2026
         */
        function applyDateMask(input) {

            let value =
                input.value.replace(/\D/g, '');

            value =
                value.substring(0, 8);

            if (value.length > 4) {

                value =
                    value.replace(
                        /^(\d{2})(\d{2})(\d+)/,
                        '$1/$2/$3'
                    );

            } else if (value.length > 2) {

                value =
                    value.replace(
                        /^(\d{2})(\d+)/,
                        '$1/$2'
                    );

            }

            input.value = value;
        }

        /*
         * Converte:
         *
         * 25/08/2026
         *
         * para:
         *
         * 2026-08-25
         */
        function convertBRDateToISO(value) {

            const match =
                String(value || '')
                    .trim()
                    .match(
                        /^(\d{2})\/(\d{2})\/(\d{4})$/
                    );

            if (!match) {
                return null;
            }

            const [
                ,
                day,
                month,
                year
            ] = match;

            const date =
                new Date(
                    Number(year),
                    Number(month) - 1,
                    Number(day)
                );

            if (
                date.getFullYear() !== Number(year) ||
                date.getMonth() !== Number(month) - 1 ||
                date.getDate() !== Number(day)
            ) {
                return null;
            }

            return `${year}-${month}-${day}`;
        }

        function formatDateBR(date) {

            const pad = value =>
                String(value).padStart(
                    2,
                    '0'
                );

            return (
                `${pad(date.getDate())}/` +
                `${pad(date.getMonth() + 1)}/` +
                `${date.getFullYear()}`
            );
        }

        function initializeDates() {

            const today =
                new Date();

            const todayFormatted =
                formatDateBR(today);

            const startInput =
                document.getElementById(
                    'dataInicioInput'
                );

            const endInput =
                document.getElementById(
                    'dataFimInput'
                );

            if (!startInput.value) {
                startInput.value =
                    todayFormatted;
            }

            if (!endInput.value) {
                endInput.value =
                    todayFormatted;
            }

        }

        function getPayload() {

            const startDate =
                convertBRDateToISO(
                    document.getElementById(
                        'dataInicioInput'
                    ).value
                );

            const endDate =
                convertBRDateToISO(
                    document.getElementById(
                        'dataFimInput'
                    ).value
                );

            if (!startDate) {

                throw new Error(
                    'Informe uma data inicial válida no formato DD/MM/YYYY.'
                );

            }

            if (!endDate) {

                throw new Error(
                    'Informe uma data final válida no formato DD/MM/YYYY.'
                );

            }

            if (startDate > endDate) {

                throw new Error(
                    'A data inicial não pode ser maior que a data final.'
                );

            }

            return {
                dth_inicio:
                    `${startDate} 00:00:00`,

                dth_fim:
                    `${endDate} 23:59:59`
            };

        }

        function showMessage(
            message,
            type = 'error'
        ) {

            const container =
                document.getElementById(
                    'messageContainer'
                );

            container.classList.remove(
                'hidden'
            );

            const classes =
                type === 'success'
                    ? 'bg-emerald-50 border-emerald-200 text-emerald-700'
                    : type === 'warning'
                        ? 'bg-orange-50 border-orange-200 text-orange-700'
                        : 'bg-rose-50 border-rose-200 text-rose-700';

            container.innerHTML = `
                <div
                    class="
                        rounded-2xl
                        border
                        px-4
                        py-3
                        text-sm
                        font-semibold
                        ${classes}
                    "
                >
                    ${escapeHtml(message)}
                </div>
            `;

        }

        function hideMessage() {

            const container =
                document.getElementById(
                    'messageContainer'
                );

            container.classList.add(
                'hidden'
            );

            container.innerHTML = '';

        }

        function clearFilters() {

            document.getElementById(
                'dataInicioInput'
            ).value = '';

            document.getElementById(
                'dataFimInput'
            ).value = '';

            document.getElementById(
                'filterInput'
            ).value = '';

            originalData = [];
            filteredData = [];

            initializeDates();
            renderTable();
            hideMessage();

            document.getElementById(
                'lastUpdateText'
            ).textContent =
                'Aguardando consulta';

            const dot =
                document.getElementById(
                    'statusDot'
                );

            dot.className =
                'h-2 w-2 rounded-full bg-slate-400';

        }

        /*
         * ============================================
         * KPIS
         * ============================================
         */

        function updateKPIs() {

            const total =
                filteredData.reduce(
                    (
                        accumulator,
                        row
                    ) =>
                        accumulator +
                        (
                            Number(
                                row.count
                            ) || 0
                        ),
                    0
                );

            const units =
                filteredData.length;

            const largest =
                filteredData.reduce(
                    (
                        currentLargest,
                        row
                    ) => {

                        if (
                            !currentLargest ||
                            Number(row.count) >
                            Number(currentLargest.count)
                        ) {

                            return row;

                        }

                        return currentLargest;

                    },
                    null
                );

            const average =
                units > 0
                    ? total / units
                    : 0;

            document.getElementById(
                'kpiTotal'
            ).textContent =
                formatNumber(total);

            document.getElementById(
                'kpiUnits'
            ).textContent =
                formatNumber(units);

            document.getElementById(
                'kpiLargest'
            ).textContent =
                largest
                    ? formatNumber(
                        largest.count
                    )
                    : '0';

            document.getElementById(
                'kpiLargestUnit'
            ).textContent =
                largest
                    ? (
                        largest.nom_unid_oper ||
                        'Unidade não informada'
                    )
                    : '—';

            document.getElementById(
                'kpiAverage'
            ).textContent =
                average.toLocaleString(
                    'pt-BR',
                    {
                        maximumFractionDigits: 1
                    }
                );

            document.getElementById(
                'resultCounter'
            ).textContent =
                `${filteredData.length} registro${filteredData.length === 1
                    ? ''
                    : 's'
                }`;

        }

        /*
         * ============================================
         * FILTRO
         * ============================================
         */

        function applyFilter() {

            const filter =
                normalizeText(
                    document.getElementById(
                        'filterInput'
                    ).value
                );

            filteredData =
                originalData.filter(
                    row => {

                        if (!filter) {
                            return true;
                        }

                        return [
                            row.cod_unid_negoc,
                            row.cod_unid_oper,
                            row.nom_unid_oper,
                            row.count
                        ].some(
                            value =>
                                normalizeText(
                                    value
                                ).includes(
                                    filter
                                )
                        );

                    }
                );


            currentPage = 1;
            sortData();
            renderTable();

        }

        /*
         * ============================================
         * ORDENAÇÃO
         * ============================================
         */

        function getSortValue(
            row,
            key
        ) {

            if (
                key === 'count' ||
                key === 'cod_unid_negoc' ||
                key === 'cod_unid_oper'
            ) {

                return Number(
                    row[key]
                ) || 0;

            }

            return normalizeText(
                row[key]
            );

        }

        function sortData() {

            filteredData.sort(
                (
                    first,
                    second
                ) => {

                    const a =
                        getSortValue(
                            first,
                            sortKey
                        );

                    const b =
                        getSortValue(
                            second,
                            sortKey
                        );

                    let comparison = 0;

                    if (
                        typeof a === 'number' &&
                        typeof b === 'number'
                    ) {

                        comparison =
                            a - b;

                    } else {

                        comparison =
                            String(a)
                                .localeCompare(
                                    String(b),
                                    'pt-BR'
                                );

                    }

                    return sortAsc
                        ? comparison
                        : -comparison;

                }
            );

        }

        function sortBy(key) {

            if (sortKey === key) {

                sortAsc =
                    !sortAsc;

            } else {

                sortKey =
                    key;

                sortAsc =
                    true;

            }

            currentPage = 1;
            sortData();
            renderTable();

        }

        /*
         * ============================================
         * TABELA
         * ============================================
         */

        function createHeader() {

            const headerRow =
                document.getElementById(
                    'tableHead'
                );

            headerRow.innerHTML = '';

            /*
             * Duas unidades por linha.
             */
            for (let group = 0; group < 2; group++) {

                columns.forEach(
                    column => {

                        const th =
                            document.createElement(
                                'th'
                            );

                        th.className = `
                px-4
                py-3
                text-left
                text-[11px]
                uppercase
                tracking-wide
                text-slate-600
                cursor-pointer
                hover:bg-slate-300
                transition
                whitespace-nowrap
            `;

                        /*
                         * Cria uma pequena separação
                         * entre o resultado 1 e o 2.
                         */
                        if (
                            group === 1 &&
                            column === columns[0]
                        ) {

                            th.classList.add(
                                'border-l-4',
                                'border-white'
                            );

                        }

                        th.onclick =
                            () =>
                                sortBy(
                                    column.key
                                );

                        const indicator =
                            sortKey === column.key
                                ? (
                                    sortAsc
                                        ? ' ▲'
                                        : ' ▼'
                                )
                                : '';

                        th.textContent =
                            column.label +
                            indicator;

                        headerRow.appendChild(
                            th
                        );

                    }
                );

            }

        }

        function appendRecordCells(
            tr,
            row,
            secondGroup = false
        ) {

            /*
             * Unidade de negócio
             */
            const tdNeg =
                document.createElement(
                    'td'
                );

            tdNeg.className =
                `
            px-4
            py-3
            text-slate-700
            font-semibold
            ${secondGroup
                    ? 'border-l-4 border-slate-100'
                    : ''
                }
        `;

            tdNeg.textContent =
                row.cod_unid_negoc ??
                '—';

            tr.appendChild(
                tdNeg
            );

            /*
             * Unidade operacional
             */
            const tdOper =
                document.createElement(
                    'td'
                );

            tdOper.className =
                'px-4 py-3 text-slate-700 font-semibold';

            tdOper.textContent =
                row.cod_unid_oper ??
                '—';

            tr.appendChild(
                tdOper
            );

            /*
             * Nome da unidade
             */
            const tdName =
                document.createElement(
                    'td'
                );

            tdName.className =
                'px-4 py-3';

            tdName.innerHTML = `
        <p
            class="
                font-bold
                text-slate-900
                whitespace-nowrap
            "
        >
            ${escapeHtml(
                row.nom_unid_oper ||
                'Unidade não informada'
            )}
        </p>
    `;

            tr.appendChild(
                tdName
            );

            /*
             * Solicitações
             */
            const tdCount =
                document.createElement(
                    'td'
                );

            tdCount.className =
                'px-4 py-3';

            tdCount.innerHTML = `
        <span
            class="
                inline-flex
                items-center
                justify-center
                min-w-[72px]
                px-3
                py-1.5
                rounded-full
                bg-orange-50
                text-orange-700
                border
                border-orange-200
                text-sm
                font-black
            "
        >
            ${formatNumber(
                row.count
            )}
        </span>
    `;

            tr.appendChild(
                tdCount
            );

        }

        function renderTable() {

            createHeader();

            const tbody =
                document.getElementById(
                    'tableBody'
                );

            tbody.innerHTML = '';

            /*
             * Quantidade total de páginas.
             */
            const totalPages =
                Math.max(
                    1,
                    Math.ceil(
                        filteredData.length /
                        recordsPerPage
                    )
                );

            /*
             * Garante que a página atual
             * nunca seja maior que o total.
             */
            if (
                currentPage >
                totalPages
            ) {

                currentPage =
                    totalPages;

            }

            /*
             * Pega somente os 10 registros
             * da página atual.
             */
            const startIndex =
                (
                    currentPage - 1
                ) *
                recordsPerPage;

            const endIndex =
                startIndex +
                recordsPerPage;

            const pageData =
                filteredData.slice(
                    startIndex,
                    endIndex
                );

            if (
                pageData.length === 0
            ) {

                tbody.innerHTML = `
        <tr>
            <td
                colspan="8"
                class="
                    px-4
                    py-14
                    text-center
                    text-sm
                    text-slate-500
                    bg-white
                "
            >
                Nenhum resultado para exibir.
            </td>
        </tr>
    `;

            } else {

                /*
                 * Como queremos 2 registros
                 * por linha, avançamos de 2 em 2.
                 */
                for (
                    let index = 0;
                    index < pageData.length;
                    index += 2
                ) {

                    const first =
                        pageData[index];

                    const second =
                        pageData[index + 1];

                    const tr =
                        document.createElement(
                            'tr'
                        );

                    tr.className = `
            hover:bg-orange-50/40
            transition
            fade-in
        `;

                    /*
                     * Primeiro registro.
                     */
                    appendRecordCells(
                        tr,
                        first,
                        false
                    );

                    /*
                     * Segundo registro.
                     *
                     * Caso não exista, adicionamos
                     * quatro células vazias.
                     */
                    if (second) {

                        appendRecordCells(
                            tr,
                            second,
                            true
                        );

                    } else {

                        for (
                            let empty = 0;
                            empty < 4;
                            empty++
                        ) {

                            const td =
                                document.createElement(
                                    'td'
                                );

                            td.className =
                                empty === 0
                                    ? 'px-4 py-3 border-l-4 border-slate-100'
                                    : 'px-4 py-3';

                            tr.appendChild(
                                td
                            );

                        }

                    }

                    tbody.appendChild(
                        tr
                    );

                }

            }

            renderFooter();
            renderMobileCards();
            updateKPIs();
            renderPagination();

        }

        function renderPagination() {

            const totalPages =
                Math.max(
                    1,
                    Math.ceil(
                        filteredData.length /
                        recordsPerPage
                    )
                );

            const container =
                document.getElementById(
                    'paginationContainer'
                );

            const info =
                document.getElementById(
                    'paginationInfo'
                );

            const pageNumber =
                document.getElementById(
                    'pageNumber'
                );

            const prevButton =
                document.getElementById(
                    'prevPageBtn'
                );

            const nextButton =
                document.getElementById(
                    'nextPageBtn'
                );

            /*
             * Esconde paginação caso não
             * existam registros.
             */
            if (
                filteredData.length === 0
            ) {

                container.classList.add(
                    'hidden'
                );

                return;

            }

            container.classList.remove(
                'hidden'
            );

            /*
             * Mantém md:flex do Tailwind.
             */
            container.classList.add(
                'md:flex'
            );

            const start =
                (
                    currentPage - 1
                ) *
                recordsPerPage +
                1;

            const end =
                Math.min(
                    currentPage *
                    recordsPerPage,
                    filteredData.length
                );

            info.textContent =
                `${start}–${end} de ${filteredData.length} registros`;

            pageNumber.textContent =
                currentPage;

            prevButton.disabled =
                currentPage <= 1;

            nextButton.disabled =
                currentPage >= totalPages;

        }


        function previousPage() {

            if (
                currentPage <= 1
            ) {
                return;
            }

            currentPage--;

            renderTable();

            scrollToTable();

        }


        function nextPage() {

            const totalPages =
                Math.ceil(
                    filteredData.length /
                    recordsPerPage
                );

            if (
                currentPage >=
                totalPages
            ) {
                return;
            }

            currentPage++;

            renderTable();

            scrollToTable();

        }


        function scrollToTable() {

            const table =
                document.querySelector(
                    '.desktop-table-wrap'
                );

            if (!table) {
                return;
            }

            table.scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });

        }

        function renderFooter() {

            const footer =
                document.getElementById(
                    'tableFooter'
                );

            const total =
                filteredData.reduce(
                    (
                        accumulator,
                        row
                    ) =>
                        accumulator +
                        (
                            Number(
                                row.count
                            ) || 0
                        ),
                    0
                );

            footer.innerHTML = `
                <td
                    class="
                        px-4
                        py-3
                        text-slate-700
                    "
                >
                    Total
                </td>

                <td></td>

                <td
                    class="
                        px-4
                        py-3
                        text-slate-500
                    "
                >
                    ${filteredData.length}
                    unidade${filteredData.length === 1
                    ? ''
                    : 's'
                }
                </td>

                <td
                    class="
                        px-4
                        py-3
                        font-black
                        text-orange-700
                    "
                >
                    ${formatNumber(total)}
                </td>
            `;

        }

        function renderMobileCards() {

            const container =
                document.getElementById(
                    'mobileCardsContainer'
                );

            if (
                filteredData.length === 0
            ) {

                container.innerHTML = `
                    <div
                        class="
                            rounded-2xl
                            border
                            border-slate-200
                            bg-white
                            p-5
                            text-center
                            text-sm
                            text-slate-500
                            shadow-card
                        "
                    >
                        Nenhum resultado para exibir.
                    </div>
                `;

                return;

            }

            container.innerHTML =
                filteredData
                    .map(
                        row => `
                            <article
                                class="
                                    exam-mobile-card
                                    rounded-3xl
                                    p-4
                                    fade-in
                                "
                            >

                                <div
                                    class="
                                        flex
                                        items-start
                                        justify-between
                                        gap-3
                                    "
                                >

                                    <div
                                        class="
                                            min-w-0
                                        "
                                    >

                                        <p
                                            class="
                                                text-[10px]
                                                uppercase
                                                tracking-[0.16em]
                                                text-slate-400
                                                font-black
                                            "
                                        >
                                            Unidade operacional
                                        </p>

                                        <h3
                                            class="
                                                mt-1
                                                text-base
                                                font-black
                                                text-slate-900
                                            "
                                        >
                                            ${escapeHtml(
                            row.nom_unid_oper ||
                            'Unidade não informada'
                        )}
                                        </h3>

                                    </div>

                                    <span
                                        class="
                                            shrink-0
                                            inline-flex
                                            items-center
                                            justify-center
                                            min-w-[64px]
                                            px-3
                                            py-1.5
                                            rounded-full
                                            bg-orange-50
                                            text-orange-700
                                            border
                                            border-orange-200
                                            text-sm
                                            font-black
                                        "
                                    >
                                        ${formatNumber(
                            row.count
                        )}
                                    </span>

                                </div>

                                <div
                                    class="
                                        mt-4
                                        grid
                                        grid-cols-2
                                        gap-3
                                    "
                                >

                                    <div
                                        class="
                                            rounded-2xl
                                            bg-slate-50
                                            border
                                            border-slate-100
                                            p-3
                                        "
                                    >

                                        <p
                                            class="
                                                text-[10px]
                                                uppercase
                                                tracking-wide
                                                text-slate-400
                                                font-bold
                                            "
                                        >
                                            Unid. negócio
                                        </p>

                                        <p
                                            class="
                                                mt-1
                                                text-lg
                                                font-black
                                                text-slate-800
                                            "
                                        >
                                            ${escapeHtml(
                            row.cod_unid_negoc
                        )}
                                        </p>

                                    </div>

                                    <div
                                        class="
                                            rounded-2xl
                                            bg-slate-50
                                            border
                                            border-slate-100
                                            p-3
                                        "
                                    >

                                        <p
                                            class="
                                                text-[10px]
                                                uppercase
                                                tracking-wide
                                                text-slate-400
                                                font-bold
                                            "
                                        >
                                            Unid. operacional
                                        </p>

                                        <p
                                            class="
                                                mt-1
                                                text-lg
                                                font-black
                                                text-slate-800
                                            "
                                        >
                                            ${escapeHtml(
                            row.cod_unid_oper
                        )}
                                        </p>

                                    </div>

                                </div>

                                <div
                                    class="
                                        mt-3
                                        rounded-2xl
                                        bg-orange-50
                                        border
                                        border-orange-100
                                        p-3
                                    "
                                >

                                    <p
                                        class="
                                            text-[10px]
                                            uppercase
                                            tracking-wide
                                            text-orange-500
                                            font-bold
                                        "
                                    >
                                        Solicitações
                                    </p>

                                    <p
                                        class="
                                            mt-1
                                            text-2xl
                                            font-black
                                            text-orange-700
                                        "
                                    >
                                        ${formatNumber(
                            row.count
                        )}
                                    </p>

                                </div>

                            </article>
                        `
                    )
                    .join('');

        }

        /*
         * ============================================
         * ENDPOINT
         * ============================================
         */

        async function loadData() {

            hideMessage();

            let payload;

            try {

                payload =
                    getPayload();

            } catch (error) {

                showMessage(
                    error.message
                );

                return;

            }

            const button =
                document.getElementById(
                    'searchBtn'
                );

            const dot =
                document.getElementById(
                    'statusDot'
                );

            const updateText =
                document.getElementById(
                    'lastUpdateText'
                );

            button.disabled =
                true;

            button.classList.add(
                'opacity-60',
                'cursor-not-allowed'
            );

            button.innerHTML = `
                <svg
                    class="
                        animate-spin
                        h-4
                        w-4
                    "
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                >
                    <circle
                        class="opacity-25"
                        cx="12"
                        cy="12"
                        r="10"
                        stroke="currentColor"
                        stroke-width="4"
                    ></circle>

                    <path
                        class="opacity-75"
                        fill="currentColor"
                        d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
                    ></path>
                </svg>

                Consultando...
            `;

            dot.className =
                'h-2 w-2 rounded-full bg-orange-400 animate-pulse';

            updateText.textContent =
                'Consultando...';

            console.log(
                'POST:',
                endpoint
            );

            console.log(
                'Payload:',
                payload
            );

            try {

                const response =
                    await fetch(
                        endpoint,
                        {
                            method:
                                'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body:
                                JSON.stringify(
                                    payload
                                ),

                            cache:
                                'no-store'
                        }
                    );

                if (
                    !response.ok
                ) {

                    throw new Error(
                        `Erro HTTP ${response.status}`
                    );

                }

                const data =
                    await response.json();

                if (
                    !Array.isArray(data)
                ) {

                    throw new Error(
                        'O endpoint retornou um formato inesperado.'
                    );

                }

                originalData =
                    data.map(
                        row => ({
                            ...row,

                            count:
                                Number(
                                    row.count
                                ) || 0
                        })
                    );

                filteredData =
                    [...originalData];

                currentPage = 1;

                /*
                 * Maior quantidade primeiro.
                 */
                sortKey =
                    'count';

                sortAsc =
                    false;

                sortData();
                renderTable();

                const now =
                    new Date();

                updateText.textContent =
                    `Atualizado às ${now.toLocaleTimeString(
                        'pt-BR',
                        {
                            hour:
                                '2-digit',
                            minute:
                                '2-digit',
                            second:
                                '2-digit'
                        }
                    )
                    }`;

                dot.className =
                    'h-2 w-2 rounded-full bg-emerald-400';

                if (
                    data.length === 0
                ) {

                    showMessage(
                        'A consulta foi concluída, mas não retornou solicitações para os parâmetros informados.',
                        'warning'
                    );

                }

            } catch (error) {

                console.error(
                    'Erro ao consultar solicitações:',
                    error
                );

                originalData =
                    [];

                filteredData =
                    [];

                renderTable();

                showMessage(
                    `Não foi possível realizar a consulta: ${error.message}`
                );

                updateText.textContent =
                    'Erro na consulta';

                dot.className =
                    'h-2 w-2 rounded-full bg-rose-400';

            } finally {

                button.disabled =
                    false;

                button.classList.remove(
                    'opacity-60',
                    'cursor-not-allowed'
                );

                button.innerHTML = `
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="h-4 w-4"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <circle
                            cx="11"
                            cy="11"
                            r="8"
                        ></circle>

                        <path
                            stroke-linecap="round"
                            d="M21 21l-4.35-4.35"
                        />
                    </svg>

                    Consultar
                `;

                dot.classList.remove(
                    'animate-pulse'
                );

            }

        }

        /*
         * ============================================
         * EVENTOS
         * ============================================
         */

        document.getElementById(
            'dataInicioInput'
        ).addEventListener(
            'input',
            event =>
                applyDateMask(
                    event.target
                )
        );

        document.getElementById(
            'dataFimInput'
        ).addEventListener(
            'input',
            event =>
                applyDateMask(
                    event.target
                )
        );

        /*
         * Enter faz a consulta.
         */
        [
            'dataInicioInput',
            'dataFimInput'
        ].forEach(
            id => {

                document.getElementById(
                    id
                ).addEventListener(
                    'keydown',
                    event => {

                        if (
                            event.key ===
                            'Enter'
                        ) {

                            loadData();

                        }

                    }
                );

            }
        );

        /*
         * Menu principal
         */
        const menuBtn =
            document.getElementById(
                'menuBtn'
            );

        const menuPanel =
            document.getElementById(
                'menuPanel'
            );

        menuBtn.addEventListener(
            'click',
            event => {

                event.stopPropagation();

                menuPanel.classList.toggle(
                    'hidden'
                );

            }
        );

        document.addEventListener(
            'click',
            event => {

                if (
                    !menuPanel.contains(
                        event.target
                    ) &&
                    !menuBtn.contains(
                        event.target
                    )
                ) {

                    menuPanel.classList.add(
                        'hidden'
                    );

                }

            }
        );

        document.addEventListener(
            'keydown',
            event => {

            }
        );

        /*
         * Inicialização.
         *
         * Não faço a consulta automaticamente
         * porque primeiro precisamos dos códigos.
         */
        initializeDates();
        renderTable();

    </script>
